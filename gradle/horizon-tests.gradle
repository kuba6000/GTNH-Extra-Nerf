interface HorizonTestFiles {
    @javax.inject.Inject
    org.gradle.api.file.FileSystemOperations getFiles()
}

if (providers.gradleProperty('horizonQaIntegration').map { it.toBoolean() }.getOrElse(false)) {
    def frameworkPath = providers.gradleProperty('horizonQaHome').get()
    def framework = file(frameworkPath)
    def sdkManifest = new File(framework, 'sdk.json')
    def sdk = sdkManifest.isFile() ? new groovy.json.JsonSlurper().parse(sdkManifest) : null
    def explicitDevJar = providers.gradleProperty('horizonQaDevJar').orNull
    if (explicitDevJar == null && sdk == null && !new File(framework, 'framework.json').isFile()) {
        throw new GradleException('Prepare the pinned Horizon-QA dependency with .github/scripts/run_horizon_tests.py')
    }
    def devJar = explicitDevJar != null ? file(explicitDevJar) : new File(framework, sdk != null ? sdk.devJar : 'horizonqa-dev.jar')
    dependencies {
        compileOnly files(devJar)
        if (providers.gradleProperty('horizonQaClientTask').getOrElse(':runFullPack') == ':runClient') {
            runtimeOnlyNonPublishable files(devJar)
        }
    }
    sourceSets.main.java.srcDir('src/integrationTest/java')
    sourceSets.main.resources.srcDir('src/integrationTest/resources')

    def server = providers.gradleProperty('horizonQaServerReportDir').isPresent()
    def report = providers.gradleProperty(server ? 'horizonQaServerReportDir' : 'horizonQaClientReportDir').orNull
    if (report != null) {
        def game = new File(report, 'game')
        def runtimePath = layout.buildDirectory.file("fullpack/${server ? 'server' : 'client'}-runtime.path").get().asFile
        def explicitRuntimeJar = providers.gradleProperty('horizonQaRuntimeJar').orNull
        def runtimeJar = explicitRuntimeJar != null ? file(explicitRuntimeJar) : new File(framework, sdk != null ? sdk.runtimeJar : 'horizonqa.jar')
        def seedWorldPath = providers.gradleProperty('horizonQaSeedWorld').orNull
        if (seedWorldPath != null && !server) {
            throw new GradleException('horizonQaSeedWorld requires a supervised server run')
        }
        def seedWorld = seedWorldPath == null ? null : file(seedWorldPath)
        def operations = objects.newInstance(HorizonTestFiles)
        tasks.named(server ? 'prepareFullPackServer' : 'prepareFullPackClient') {
            inputs.file(runtimeJar)
            if (seedWorld != null) inputs.dir(seedWorld)
            doLast {
                def prepared = new File(runtimePath.getText('UTF-8').trim())
                operations.files.copy {
                    from prepared
                    into game
                    exclude 'saves/**', 'logs/**', 'crash-reports/**', 'screenshots/**', 'options.txt'
                    if (server) exclude 'world/**'
                }
                operations.files.copy {
                    from runtimeJar
                    into new File(game, 'mods')
                }
                if (seedWorld != null) {
                    def targetWorld = new File(game, 'world')
                    if (!new File(seedWorld, 'level.dat').isFile() || targetWorld.exists()) {
                        throw new GradleException('Seed world must contain level.dat and target world must be new')
                    }
                    operations.files.copy {
                        from seedWorld
                        into targetWorld
                    }
                }
                runtimePath.setText(game.absolutePath, 'UTF-8')
            }
        }
    }
}
