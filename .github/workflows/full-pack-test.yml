name: Full pack compatibility test

on:
  workflow_dispatch:

jobs:
  full-pack-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout mod repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Checkout pinned Horizon-QA client tools
        uses: actions/checkout@v5
        with:
          repository: GTNewHorizons/Horizon-QA
          ref: ad5adb0f8ccede91de4b5da2db50fc0534a4250c
          path: build/horizonqa-framework
          fetch-depth: 0
      - name: Set up Java toolchains
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            17
            21
            25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
      - name: Install graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 x11-xserver-utils
      - name: Run main Horizon-QA scenarios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          xvfb-run -a python3 .github/scripts/run_horizon_tests.py
          --framework-source build/horizonqa-framework
          --report-dir build/horizonqa/ci
          --timeout-seconds 2400
      - name: Run isolated loot and quest scenarios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          xvfb-run -a python3 .github/scripts/run_horizon_tests.py
          --tests gtnhextranerfquesttests,gtnhextranerfloottests
          --framework-source build/horizonqa-framework
          --report-dir build/horizonqa/isolated
          --timeout-seconds 1200
      - name: Upload Horizon-QA reports and game evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-pack-client-horizonqa
          path: |
            build/horizonqa/ci/launch-result.json
            build/horizonqa/ci/horizonqa-result.json
            build/horizonqa/ci/TEST-horizonqa.xml
            build/horizonqa/ci/launch.log
            build/horizonqa/ci/verification.log
            build/horizonqa/ci/artifacts
            build/horizonqa/ci/game/logs
            build/horizonqa/ci/game/crash-reports
            build/horizonqa/isolated/launch-result.json
            build/horizonqa/isolated/horizonqa-result.json
            build/horizonqa/isolated/TEST-horizonqa.xml
            build/horizonqa/isolated/launch.log
            build/horizonqa/isolated/verification.log
            build/horizonqa/isolated/artifacts
            build/horizonqa/isolated/game/logs
            build/horizonqa/isolated/game/crash-reports
          retention-days: 14

  full-pack-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout mod repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java toolchains
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            17
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test full-pack server harness
        run: python .github/scripts/test_run_full_pack_server.py

      - name: Run full-pack server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python .github/scripts/run_full_pack_server.py
          --ready-timeout 2400
          --stop-timeout 300

      - name: Upload full-pack server evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-pack-server-evidence
          path: build/fullpack/server-evidence/
          if-no-files-found: warn
          retention-days: 30
